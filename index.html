    document.getElementById('btn-modal-settings-close')
      .addEventListener('click', () => closeModal('modal-settings'));

    document.getElementById('modal-settings')
      .addEventListener('click', ev => {
        if (ev.target === ev.currentTarget) closeModal('modal-settings');
      });

    // Wallets → open wallet manager modal (closes settings first for clarity)
    document.getElementById('settings-wallets-item').addEventListener('click', () => {
      closeModal('modal-settings');
      setTimeout(() => openWalletsModal(), 200);
    });

    // Export CSV → open export picker
    document.getElementById('settings-export-item').addEventListener('click', () => {
      closeModal('modal-settings');
      setTimeout(() => handleExportCsv(), 200);
    });

    // Backup → download JSON
    document.getElementById('settings-backup-item')
      .addEventListener('click', handleBackup);

    // Restore → open file picker, validate, confirm, then reload
    document.getElementById('settings-restore-item')
      .addEventListener('click', handleRestoreSelect);
    document.getElementById('restore-file-input')
      .addEventListener('change', function () {
        const file = this.files[0];
        this.value = '';  // reset so the same file can be re-selected next time
        handleRestoreFile(file);
      });

    // Theme → cycle dark → light → auto → dark
    document.getElementById('settings-theme-item')
      .addEventListener('click', cycleTheme);

    // Reset data → show inline confirm
    document.getElementById('settings-reset-item')
      .addEventListener('click', handleResetRequest);

    // ── Custom Categories ────────────────────────────────────
    const catPanelBtn = document.getElementById('settings-categories-item');
    const catPanel    = document.getElementById('settings-cat-panel');
    const catCaret    = document.getElementById('settings-cat-caret');
    const catInput    = document.getElementById('settings-cat-input');
    const catList     = document.getElementById('settings-cat-list');
    const btnAddCat   = document.getElementById('btn-add-cat');

    // Toggle the inline panel open/closed
    catPanelBtn.addEventListener('click', () => {
      const isOpen = !catPanel.classList.contains('hidden');
      catPanel.classList.toggle('hidden', isOpen);
      catCaret.textContent = isOpen ? '›' : '⌄';
      if (!isOpen) {
        renderCategorySettings();
        requestAnimationFrame(() => catInput.focus());
      }
    });

    // Delete a custom category (event-delegated to the list)
    catList.addEventListener('click', e => {
      const btn = e.target.closest('[data-catdelete]');
      if (!btn) return;
      const name = btn.dataset.catdelete;
      saveCustomCategories(loadCustomCategories().filter(c => c !== name));
      renderCategorySettings();
      refreshCategorySelects();
      showToast(`"${name}" removed`);
    });

    // Add a new custom category
    function doAddCategory () {
      const name = catInput.value.trim();
      if (!name) return;
      if (name.length > 30) {
        showToast('Name must be 30 characters or fewer.', true); return;
      }
      if (getCategories().some(c => c.toLowerCase() === name.toLowerCase())) {
        showToast(`"${name}" already exists.`, true); return;
      }
      saveCustomCategories([...loadCustomCategories(), name]);
      catInput.value = '';
      renderCategorySettings();
      refreshCategorySelects();
      showToast(`✓ "${name}" added`);
    }

    btnAddCat.addEventListener('click', doAddCategory);
    catInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAddCategory(); });

    // ── Recurring Transactions ───────────────────────────────
    const recPanelBtn  = document.getElementById('settings-recurring-item');
    const recPanel     = document.getElementById('settings-rec-panel');
    const recCaret     = document.getElementById('settings-rec-caret');
    const recList      = document.getElementById('settings-rec-list');
    const recDescEl    = document.getElementById('rec-desc');
    const recAmountEl  = document.getElementById('rec-amount');
    const recTypeEl    = document.getElementById('rec-type');
    const recFreqEl    = document.getElementById('rec-frequency');
    const recCatEl     = document.getElementById('rec-category');
    const recStartEl   = document.getElementById('rec-start');
    const btnAddRec    = document.getElementById('btn-add-rec');

    // Toggle recurring panel
    recPanelBtn.addEventListener('click', () => {
      const isOpen = !recPanel.classList.contains('hidden');
      recPanel.classList.toggle('hidden', isOpen);
      recCaret.textContent = isOpen ? '›' : '⌄';
      if (!isOpen) {
        renderRecurringSettings();
        buildCategoryOptions(recCatEl, { selected: 'Uncategorized' });
        // Default start date = tomorrow
        const tom = new Date();
        tom.setDate(tom.getDate() + 1);
        recStartEl.value = `${tom.getFullYear()}-${String(tom.getMonth()+1).padStart(2,'0')}-${String(tom.getDate()).padStart(2,'0')}`;
        requestAnimationFrame(() => recDescEl.focus());
      }
    });

    // Pause / resume a recurring (delegated)
    recList.addEventListener('click', e => {
      const pauseBtn = e.target.closest('[data-recpause]');
      if (pauseBtn) {
        const id        = pauseBtn.dataset.recpause;
        const templates = loadRecurring();
        const tmpl      = templates.find(t => t.id === id);
        if (tmpl) {
          tmpl.paused = !tmpl.paused;
          saveRecurring(templates);
          renderRecurringSettings();
        }
        return;
      }
      // Delete a recurring (delegated)
      const delBtn = e.target.closest('[data-recdelete]');
      if (delBtn) {
        const id = delBtn.dataset.recdelete;
        saveRecurring(loadRecurring().filter(t => t.id !== id));
        renderRecurringSettings();
        showToast('Recurring removed');
      }
    });

    // Add a new recurring
    function doAddRecurring () {
      const desc   = recDescEl.value.trim();
      const amount = parseFloat(recAmountEl.value);
      const start  = recStartEl.value;

      if (!desc)              { showToast('Please enter a description.', true); return; }
      if (!amount || amount <= 0) { showToast('Please enter a valid amount.', true); return; }
      if (!start)             { showToast('Please set a first-due date.', true); return; }

      const wallet = getActiveWallet();
      if (!wallet)            { showToast('⚠ No wallet selected.', true); return; }

      const template = {
        id:          makeId(),
        walletId:    wallet.id,
        description: desc,
        amount:      Math.round(amount * 100) / 100,
        type:        recTypeEl.value,
        category:    recCatEl.value || 'Uncategorized',
        frequency:   recFreqEl.value,
        nextDue:     start,
        paused:      false,
      };
      saveRecurring([...loadRecurring(), template]);

      // Clear form
      recDescEl.value   = '';
      recAmountEl.value = '';

      // If first due is today or earlier, add immediately
      if (start <= todayStr()) {
        processRecurring();
        renderApp();
      }

      renderRecurringSettings();
      showToast(`✓ "${desc}" recurring added`);
      recDescEl.focus();
    }

    btnAddRec.addEventListener('click', doAddRecurring);
    recDescEl.addEventListener('keydown', e => { if (e.key === 'Enter') doAddRecurring(); });
  }

  /* ══════════════════════════════════════════════════════════════
     §8-C  FILTER BAR  —  initFilterBar()
     Wires the stable #filter-panel DOM (never rebuilt). Filter state
     lives in module vars; each change calls renderHistory() only —
     not the full renderApp() — so stats & chart are unaffected.
  ══════════════════════════════════════════════════════════════ */

  function _updateFilterIndicator () {
    const btn    = document.getElementById('btn-filter-toggle');
    if (!btn) return;
    const active = _searchQuery !== '' || _filterType !== 'all' || _filterCategory !== '';
    btn.classList.toggle('has-filters', active);
  }

  function initFilterBar () {
    const toggleBtn = document.getElementById('btn-filter-toggle');
    const panel     = document.getElementById('filter-panel');
    const input     = document.getElementById('filter-input');
    const clearBtn  = document.getElementById('filter-clear');
    const catSelect = document.getElementById('filter-category');

    function applyAndRender () {
      _historyLimit = 50;        // filter context changed — start pagination over
      _updateFilterIndicator();
      renderHistory();           // history only — chart & dashboard stay put
    }

    // ── Open / close panel ──────────────────────────────────
    toggleBtn.addEventListener('click', () => {
      _filterOpen = !_filterOpen;
      panel.classList.toggle('hidden', !_filterOpen);
      toggleBtn.classList.toggle('is-open', _filterOpen);
      toggleBtn.setAttribute('aria-expanded', String(_filterOpen));
      if (_filterOpen) requestAnimationFrame(() => input.focus());
    });

    // ── Text search ─────────────────────────────────────────
    input.addEventListener('input', () => {
      _searchQuery = input.value.trim();
      clearBtn.classList.toggle('hidden', _searchQuery === '');
      applyAndRender();
    });

    // Keyboard: Escape clears search; Enter dismisses keyboard on mobile
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (_searchQuery) {
          input.value = '';
          _searchQuery = '';
          clearBtn.classList.add('hidden');
          applyAndRender();
        } else {
          input.blur();
        }
        e.stopPropagation();
      }
    });

    clearBtn.addEventListener('click', () => {
      input.value  = '';
      _searchQuery = '';
      clearBtn.classList.add('hidden');
      input.focus();
      applyAndRender();
    });

    // ── Type chips ──────────────────────────────────────────
    panel.querySelectorAll('[data-ftype]').forEach(btn => {
      btn.addEventListener('click', () => {
        _filterType = btn.dataset.ftype;
        panel.querySelectorAll('[data-ftype]').forEach(b =>
          b.classList.toggle('active', b.dataset.ftype === _filterType));
        applyAndRender();
      });
    });

    // ── Category select ─────────────────────────────────────
    catSelect.addEventListener('change', () => {
      _filterCategory = catSelect.value;
      applyAndRender();
    });
  }


  function bootstrap () {
    // Apply saved theme immediately (before first paint)
    applyTheme(localStorage.getItem(KEY_THEME) || 'dark');

    // Wire up all static sections once at startup (elements already in DOM)
    initInputSection();
    initHistorySection();
    initSettings();
    initFilterBar();
    initPullToRefresh();
    refreshCategorySelects();   // populate all three category selects from storage

    // Dashboard listeners — attached ONCE to the stable <header> via delegation.
    // renderDashboard() rebuilds #dashboard-content on every state change, so
    // attaching directly to its child nodes would leak a new listener each time.
    document.querySelector('header').addEventListener('click', ev => {
      if (ev.target.closest('#btn-open-wallets')) { openWalletsModal(); return; }
      if (ev.target.closest('#btn-edit-balance'))  { openEditWalletModal(getActiveWallet()?.id); return; }
      const pBtn = ev.target.closest('[data-period]');
      if (pBtn) { _statPeriod = pBtn.dataset.period; renderApp(); }
    });

    // Migrate single-wallet data from older versions if needed
    migrateToMultiWallet();

    const wallets = loadWallets();
    if (wallets.length === 0) {
      // Brand-new user: prompt to create first wallet
      openBalanceModal(true);
    } else {
      // Restore active wallet (migration may have already set _activeWalletId)
      if (!_activeWalletId) {
        try {
          const saved = localStorage.getItem(KEY_ACTIVE_WALLET);
          _activeWalletId = (saved && wallets.find(w => w.id === saved))
            ? saved : wallets[0].id;
        } catch (e) { _activeWalletId = wallets[0].id; }
      }
      processRecurring();   // add any overdue entries before first render
      renderApp();
    }
  }

  document.addEventListener('DOMContentLoaded', bootstrap);


  /* ══════════════════════════════════════════════════════════════
     §7  SMART INPUT  —  Parser & Category Detector
  ══════════════════════════════════════════════════════════════ */

  // ── Category icon map — emoji shown in pills and selects ─────
  const CATEGORY_ICONS = {
    'Food & Drinks':    '🍔',
    'Transportation':   '⛽',
    'Shopping':         '🛒',
    'Bills & Utilities':'🏠',
    'Health':           '💊',
    'Entertainment':    '🎬',
    'Uncategorized':    '📋',
  };

  // ── Category colour map — donut chart slices ─────────────────
  const CATEGORY_COLORS = {
    'Food & Drinks':    '#f59e0b',
    'Transportation':   '#3b82f6',
    'Shopping':         '#8b5cf6',
    'Bills & Utilities':'#ef4444',
    'Health':           '#22c55e',
    'Entertainment':    '#ec4899',
    'Uncategorized':    '#64748b',
  };

  // ── Default category list (in display order) ─────────────────
  const DEFAULT_CATEGORIES = [
    'Food & Drinks', 'Transportation', 'Shopping',
    'Bills & Utilities', 'Health', 'Entertainment', 'Uncategorized',
  ];

  // ── Colour palette for user-defined categories ────────────────
  // Picked to be distinct from the 7 defaults above.
  const CUSTOM_CAT_PALETTE = [
    '#06b6d4', // cyan
    '#f97316', // orange
    '#84cc16', // lime
    '#a855f7', // violet
    '#14b8a6', // teal
    '#f43f5e', // rose
    '#eab308', // amber-yellow
  ];

  /* ──────────────────────────────────────────────────────────────
     Category storage helpers
  ────────────────────────────────────────────────────────────── */
  const KEY_CATEGORIES = 'mt_categories';

  function loadCustomCategories () {
    try {
      const raw = localStorage.getItem(KEY_CATEGORIES);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed)
        ? parsed.filter(c => typeof c === 'string' && c.trim())
        : [];
    } catch (e) { return []; }
  }

  function saveCustomCategories (cats) {
    try { localStorage.setItem(KEY_CATEGORIES, JSON.stringify(cats)); return true; }
    catch (e) { return false; }
  }

  /** Returns the full ordered list: defaults first, then user-defined. */
  function getCategories () {
    return [...DEFAULT_CATEGORIES, ...loadCustomCategories()];
  }

  /**
   * Stable colour per category name.
   * Defaults use CATEGORY_COLORS; custom names get a deterministic
   * pick from CUSTOM_CAT_PALETTE via a simple string hash.
   */
  function categoryColor (name) {
    if (CATEGORY_COLORS[name]) return CATEGORY_COLORS[name];
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xfffffff;
    return CUSTOM_CAT_PALETTE[Math.abs(h) % CUSTOM_CAT_PALETTE.length];
  }

  /** Emoji icon for a category — defaults use CATEGORY_ICONS, customs get 🏷️. */
  function categoryIcon (name) {
    return CATEGORY_ICONS[name] || '🏷️';
  }

  /**
   * Rebuild <option> elements inside `selectEl`.
   * Preserves any currently-selected value; safe to call at any time.
   */
  function buildCategoryOptions (selectEl, { includeAll = false, selected = '' } = {}) {
    const cats = getCategories();
    let html   = includeAll ? '<option value="">All categories</option>' : '';
    for (const cat of cats) {
      const icon = categoryIcon(cat);
      const sel  = selected === cat ? ' selected' : '';
      // \u00a0 = non-breaking space keeps icon + name from wrapping oddly
      html += `<option value="${escHtml(cat)}"${sel}>${escHtml(icon + '\u00a0' + cat)}</option>`;
    }
    selectEl.innerHTML = html;
  }

  /** Refresh all three category selects (add form, edit modal, filter bar). */
  function refreshCategorySelects () {
    const addSel    = document.getElementById('manual-category');
    const editSel   = document.getElementById('edit-category');
    const filterSel = document.getElementById('filter-category');
    if (addSel)    buildCategoryOptions(addSel,
                     { selected: addSel.value || 'Uncategorized' });
    if (editSel)   buildCategoryOptions(editSel,
                     { selected: editSel.value });
    if (filterSel) buildCategoryOptions(filterSel,
                     { includeAll: true, selected: filterSel.value });
  }

  /** Render the list of custom categories inside the settings panel. */
  function renderCategorySettings () {
    const container = document.getElementById('settings-cat-list');
    if (!container) return;
    const customs = loadCustomCategories();
    if (customs.length === 0) {
      container.innerHTML = `<p class="settings-cat-empty">No custom categories yet.</p>`;
      return;
    }
    container.innerHTML = customs.map(name => `
      <div class="settings-cat-item">
        <span class="settings-cat-icon">${categoryIcon(name)}</span>
        <span class="settings-cat-name">${escHtml(name)}</span>
        <button class="settings-cat-delete" data-catdelete="${escHtml(name)}"
                aria-label="Delete ${escHtml(name)}">✕</button>
      </div>`).join('');
  }


  /* ══════════════════════════════════════════════════════════════
     §8-D  RECURRING TRANSACTIONS
     Templates stored under KEY_RECURRING. processRecurring() is
     called at bootstrap and adds overdue entries in one batch write.
  ══════════════════════════════════════════════════════════════ */

  const KEY_RECURRING = 'mt_recurring';

  function loadRecurring () {
    try {
      const raw = localStorage.getItem(KEY_RECURRING);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }

  function saveRecurring (templates) {
    try { localStorage.setItem(KEY_RECURRING, JSON.stringify(templates)); return true; }
    catch (e) { return false; }
  }

  /**
   * Advance a YYYY-MM-DD date by one frequency period.
   * Handles month-end clamping: Jan 31 + monthly → Feb 28, not Mar 3.
   */
  function advanceDate (dateStr, frequency) {
    const [y, m, d] = dateStr.split('-').map(Number);
    let dt;
    if (frequency === 'daily')   dt = new Date(y, m - 1, d + 1);
    if (frequency === 'weekly')  dt = new Date(y, m - 1, d + 7);
    if (frequency === 'monthly') {
      const nm  = m === 12 ? 1  : m + 1;
      const ny  = m === 12 ? y + 1 : y;
      const max = new Date(ny, nm, 0).getDate();   // last day of target month
      dt = new Date(ny, nm - 1, Math.min(d, max));
    }
    if (!dt) {
      // Corrupted template data — return the input date unchanged rather than
      // crashing with a cryptic TypeError on dt.getFullYear().
      console.warn('[MT] advanceDate: unknown frequency', frequency, '— skipping');
      return dateStr;
    }
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  }

  /**
   * Add all overdue recurring transactions in one batch write.
   * Called at startup BEFORE renderApp() so the first render is complete.
   */
  function processRecurring () {
    const templates = loadRecurring();
    if (templates.length === 0) return;

    const today   = todayStr();
    const wallets = loadWallets();
    const newTxns = [];

    for (const tmpl of templates) {
      if (tmpl.paused) continue;
      if (!wallets.find(w => w.id === tmpl.walletId)) continue;  // wallet deleted
      while (tmpl.nextDue <= today) {
        newTxns.push({
          id:          makeId(),
          walletId:    tmpl.walletId,
          description: tmpl.description,
          amount:      tmpl.amount,
          type:        tmpl.type,
          category:    tmpl.category,
          date:        tmpl.nextDue,
        });
        const next = advanceDate(tmpl.nextDue, tmpl.frequency);
        if (next <= tmpl.nextDue) {
          // advanceDate returned the same (or earlier) date — unknown frequency.
          // Break instead of looping forever; the guard in advanceDate already
          // logged a warning. The template stays at this nextDue until repaired.
          console.warn('[MT] processRecurring: date did not advance for template', tmpl.id, '— breaking loop');
          break;
        }
        tmpl.nextDue = next;
      }
    }

    if (newTxns.length === 0) return;

    // One batch save — prepend newest-first, then existing transactions
    newTxns.sort((a, b) => b.date.localeCompare(a.date));
    saveTransactions([...newTxns, ...loadTransactions()]);
    saveRecurring(templates);

    // Show toast after first render settles
    const msg = newTxns.length === 1
      ? `🔁 Auto-added: ${newTxns[0].description}`
      : `🔁 Auto-added ${newTxns.length} recurring transactions`;
    setTimeout(() => showToast(msg), 500);
  }

  /** Render the recurring list inside the settings panel. */
  function renderRecurringSettings () {
    const container = document.getElementById('settings-rec-list');
    if (!container) return;
    const templates = loadRecurring();
    const today     = todayStr();

    if (templates.length === 0) {
      container.innerHTML = `
        <p class="settings-cat-empty" style="margin-bottom:10px;">
          No recurring transactions yet.
        </p>`;
      return;
    }

    container.innerHTML = templates.map(tmpl => {
      const icon     = categoryIcon(tmpl.category);
      const dueColor = tmpl.nextDue <= today ? 'var(--expense)' : 'var(--muted)';
      const dueText  = tmpl.nextDue <= today
        ? 'due today'
        : 'next ' + formatDateShort(tmpl.nextDue);
      const pauseLabel = tmpl.paused ? '▶' : '⏸';
      const pauseTitle = tmpl.paused ? 'Resume' : 'Pause';
      return `
        <div class="rec-item${tmpl.paused ? ' rec-paused' : ''}">
          <span class="settings-cat-icon">${icon}</span>
          <div class="rec-item-info">
            <span class="rec-item-name">${escHtml(tmpl.description)}</span>
            <span class="rec-item-meta">
              $${fmt(tmpl.amount)} · ${escHtml(tmpl.type)} · ${escHtml(tmpl.frequency)}
              · <span style="color:${dueColor};">${escHtml(dueText)}</span>
            </span>
          </div>
          <button class="rec-pause-btn" data-recpause="${escHtml(tmpl.id)}"
                  title="${pauseTitle}" aria-label="${pauseTitle}">${pauseLabel}</button>
          <button class="settings-cat-delete" data-recdelete="${escHtml(tmpl.id)}"
                  aria-label="Delete ${escHtml(tmpl.description)}">✕</button>
        </div>`;
    }).join('');
  }

  /** Animate a balance element counting from `from` to `to`. */
  function animateBalance (el, from, to) {
    const duration = 480;
    const t0 = performance.now();
    function tick (now) {
      const t = Math.min((now - t0) / duration, 1);
      const e = 1 - Math.pow(1 - t, 3);  // ease-out cubic
      const v = from + (to - from) * e;
      const abs = Math.abs(v);
      el.textContent = (v < 0 ? '-$' : '$') +
        abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ── Category keyword table ────────────────────────────────────
  const CATEGORY_KEYWORDS = [
    { name: 'Food & Drinks',
      words: ['lunch','dinner','breakfast','coffee','food','eat','restaurant',
              'pizza','burger','groceries','snack','drinks'] },
    { name: 'Transportation',
      words: ['uber','lyft','gas','bus','train','taxi','parking','toll',
              'subway','metro','ride'] },
    { name: 'Shopping',
      words: ['amazon','mall','clothes','shoes','store','shop','bought'] },
    { name: 'Bills & Utilities',
      words: ['rent','electric','water','internet','phone','bill',
              'subscription','netflix','spotify'] },
    { name: 'Health',
      words: ['doctor','pharmacy','medicine','gym','hospital','dentist'] },
    { name: 'Entertainment',
      words: ['movie','game','ticket','concert','bar','club'] }
  ];

  // Keyword lists per spec — checked case-insensitively
  const EXPENSE_KEYWORDS = ['spent','bought','paid','used','minus','withdrew','charged'];
  const INCOME_KEYWORDS  = ['added','earned','received','plus','deposited','put in','got'];

  /**
   * Extract the first dollar amount from a free-text sentence.
   * Requires either a leading $ sign OR a word boundary so bare
   * numbers inside words ("1080p", "2fa") are not captured.
   * Returns a positive number (2 dp) or null.
   */
  function extractAmount (text) {
    const m = text.match(/(?<!\w)\$?([\d,]+(\.\d{1,2})?)(?!\w)/);
    if (!m) return null;
    const val = parseFloat(m[1].replace(/,/g, ''));
    if (isNaN(val) || val <= 0) return null;
    return Math.round(val * 100) / 100;
  }

  /**
   * Detect transaction type by keyword scan.
   * Strips numeric tokens first so "Put $50 in my wallet" normalises to
   * "Put  in my wallet" → "put in" substring match succeeds.
   * Returns 'income' | 'expense' | 'assumed-expense'.
   */
  function detectType (text) {
    const normalised = text
      .replace(/\$?[\d,]+(\.\d{1,2})?/g, ' ')  // remove amount tokens
      .replace(/\s+/g, ' ')                       // collapse whitespace
      .toLowerCase();

    // Check income first (so "got" doesn't shadow single-word expense hits)
    for (const kw of INCOME_KEYWORDS)  { if (normalised.includes(kw)) return 'income';  }
    for (const kw of EXPENSE_KEYWORDS) { if (normalised.includes(kw)) return 'expense'; }
    return 'assumed-expense';
  }

  /**
   * Auto-assign a category from the description (case-insensitive, first match wins).
   * Returns a category name string or 'Uncategorized'.
   */
  function detectCategory (text) {
    const lower = text.toLowerCase();
    for (const cat of CATEGORY_KEYWORDS) {
      for (const word of cat.words) {
        if (lower.includes(word)) return cat.name;
      }
    }
    return 'Uncategorized';
  }

  /**
   * Parse a free-text sentence into a ready-to-save transaction object.
   * Returns { tx, assumed: boolean } or { error: string }.
   */
  /**
   * Scan `text` for a natural-language date expression.
   * Returns { date: 'YYYY-MM-DD', cleaned: text-without-date-phrase }.
   * If nothing is found, date = today and cleaned = original text.
   *
   * Recognised patterns (evaluated most-specific first):
   *   "yesterday" / "yest" / "yday"
   *   "2 days ago" / "a day ago"
   *   "last week"
   *   "last Monday" (always the previous week, even if today is Monday)
   *   "Monday" / "on Friday" / "this Tuesday" (most-recent occurrence incl. today)
   *   "on the 5th" / "the 15th" (current or previous month)
   */
  function extractDate (text) {
    const today = todayStr();

    function isoDate (dt) {
      return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    }
    function daysAgo (n) {
      const [y, m, d] = today.split('-').map(Number);
      return isoDate(new Date(y, m - 1, d - n));
    }
    // Most recent weekday (incl. today if dow matches)
    function nearestWeekday (dow) {
      const [y, m, d] = today.split('-').map(Number);
      const diff = ((new Date(y, m - 1, d).getDay() - dow) + 7) % 7;
      return diff === 0 ? today : daysAgo(diff);
    }
    // "last X" — always at least 1 full week back for same-day
    function strictLastWeekday (dow) {
      const [y, m, d] = today.split('-').map(Number);
      let diff = new Date(y, m - 1, d).getDay() - dow;
      if (diff <= 0) diff += 7;
      return daysAgo(diff);
    }

    const DOW = {
      sun:0, sunday:0, mon:1, monday:1, tue:2, tues:2, tuesday:2,
      wed:3, wednesday:3, thu:4, thur:4, thurs:4, thursday:4,
      fri:5, friday:5, sat:6, saturday:6,
    };
    const N = Object.keys(DOW).join('|');

    const patterns = [
      { re: /\b(yesterday|yest|yday)\b/i,
        fn: ()  => daysAgo(1) },

      { re: /\b(\d+|a)\s+days?\s+ago\b/i,
        fn: m   => daysAgo(m[1] === 'a' ? 1 : +m[1]) },

      { re: /\blast\s+week\b/i,
        fn: ()  => daysAgo(7) },

      { re: new RegExp(`\\blast\\s+(${N})\\b`, 'i'),
        fn: m   => strictLastWeekday(DOW[m[1].toLowerCase()]) },

      { re: new RegExp(`\\b(?:on\\s+|this\\s+)?(${N})\\b`, 'i'),
        fn: m   => nearestWeekday(DOW[m[1].toLowerCase()]) },

      { re: /\b(?:on\s+)?the\s+(\d{1,2})(?:st|nd|rd|th)?\b/i,
        fn: m   => {
          const n  = +m[1];
          if (n < 1 || n > 31) return null;
          const [y, mo] = today.split('-').map(Number);
          const pad = v => String(v).padStart(2, '0');
          const cand = `${y}-${pad(mo)}-${pad(n)}`;
          if (cand <= today) return cand;
          // This month's date is still ahead → use the previous month
          const pm = mo === 1 ? 12 : mo - 1;
          const py = mo === 1 ? y - 1 : y;
          if (n > new Date(py, pm, 0).getDate()) return null;
          return `${py}-${pad(pm)}-${pad(n)}`;
        }
      },
    ];

    for (const { re, fn } of patterns) {
      const m = text.match(re);
      if (!m) continue;
      const date = fn(m);
      if (!date || date > today) continue;    // never produce a future date

      const cleaned = text
        .replace(m[0], ' ')            // remove the matched date phrase
        .replace(/\s{2,}/g, ' ')       // collapse gaps
        .replace(/^[\s,]+|[\s,]+$/g, '') // trim stray commas
        .replace(/^(on|for|at)\s+/i, '') // drop leading filler word
        .trim();

      return { date, cleaned };
    }

    return { date: today, cleaned: text };
  }

  function parseSmartInput (text) {
    const amount = extractAmount(text);
    if (amount === null) {
      return { error: "Couldn't find an amount. Try: 'Spent $12 for lunch'" };
    }

    const { date, cleaned } = extractDate(text);
    const desc    = cleaned.trim() || text.trim();
    const rawType = detectType(text);
    const assumed = rawType === 'assumed-expense';

    const tx = {
      id:          makeId(),
      date,
      type:        assumed ? 'expense' : rawType,
      amount,
      description: desc,
      category:    detectCategory(desc),
    };
    if (assumed) tx.assumed = true;

    return { tx, assumed };
  }


  /* ══════════════════════════════════════════════════════════════
     §8  INPUT SECTION  —  Submit Handlers & Mode Toggle
  ══════════════════════════════════════════════════════════════ */

  // ── Shared commit helper ──────────────────────────────────────
  /**
   * Persist a transaction and refresh the UI.
   * Shows the 2-second toast confirmation per spec.
   */
  function commitTransaction (tx, assumed) {
    const wallet = getActiveWallet();
    if (!wallet) { showToast('⚠ No wallet selected.', true); return; }
    if (!addTransaction({ ...tx, walletId: wallet.id })) return;
    const typeLabel  = tx.type === 'income' ? 'income' : 'expense';
    const flag       = assumed ? ' ⚠ assumed expense' : '';
    const dateNote   = tx.date !== todayStr() ? ` · ${formatDateShort(tx.date)}` : '';
    showToast(`✓ Added: ${tx.description} — $${fmt(tx.amount)} (${typeLabel})${dateNote}${flag}`);
    renderApp();
  }

  // ── Smart Input submit ────────────────────────────────────────
  function handleSmartSubmit () {
    const inputEl = document.getElementById('smart-input');
    const errEl   = document.getElementById('smart-input-error');
    const text    = inputEl.value.trim();

    errEl.classList.add('hidden');

    if (!text) {
      errEl.textContent = "Type something first, e.g. 'Spent $8 for lunch'";
      errEl.classList.remove('hidden');
      return;
    }

    const result = parseSmartInput(text);
    if (result.error) {
      errEl.textContent = result.error;
      errEl.classList.remove('hidden');
      return;
    }

    commitTransaction(result.tx, result.assumed);
    inputEl.value = '';
    inputEl.focus();
  }

  // ── Manual Form submit ────────────────────────────────────────
  function handleManualSubmit () {
    const date   = document.getElementById('manual-date').value;
    const type   = document.getElementById('manual-type').value;
    const rawAmt = document.getElementById('manual-amount').value.trim();
    const desc   = document.getElementById('manual-desc').value.trim();
    const cat    = document.getElementById('manual-category').value;
    const amount = parseFloat(rawAmt);
    const errEl  = document.getElementById('manual-form-error');

    // Show inline error (consistent with smart input) and focus the offending field
    function showFormError (msg, focusId) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
      if (focusId) document.getElementById(focusId).focus();
    }
    errEl.classList.add('hidden');

    if (!date)                        return showFormError('Please select a date.', 'manual-date');
    if (!desc)                        return showFormError('Please enter a description.', 'manual-desc');
    if (isNaN(amount) || amount <= 0) return showFormError('Please enter a valid amount greater than 0.', 'manual-amount');

    commitTransaction({
      id:          makeId(),
      date,
      type,
      amount:      Math.round(amount * 100) / 100,
      description: desc,
      category:    cat
    }, false);

    // Reset amount + description; keep date & type for rapid repeat entry
    document.getElementById('manual-amount').value = '';
    document.getElementById('manual-desc').value   = '';
    document.getElementById('manual-form-error').classList.add('hidden');
    document.getElementById('manual-amount').focus();
  }

  // ── Mode toggles ──────────────────────────────────────────────
  function switchToManual () {
    document.getElementById('smart-input-wrap').classList.add('hidden');
    document.getElementById('manual-form-wrap').classList.remove('hidden');
    document.getElementById('manual-amount').focus();
  }

  function switchToSmart () {
    document.getElementById('manual-form-wrap').classList.add('hidden');
    document.getElementById('smart-input-wrap').classList.remove('hidden');
    document.getElementById('smart-input').focus();
  }

  // ── Register all input-section listeners (called once at bootstrap) ──
  function initInputSection () {
    // Default the date picker to today
    document.getElementById('manual-date').value = todayStr();

    // Smart input: Enter key + Add button
    document.getElementById('smart-input')
      .addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); handleSmartSubmit(); }
      });
    document.getElementById('btn-smart-submit')
      .addEventListener('click', handleSmartSubmit);

    // Manual form: submit button
    document.getElementById('btn-manual-submit')
      .addEventListener('click', handleManualSubmit);

    // Toggle links
    document.getElementById('btn-to-manual').addEventListener('click', switchToManual);
    document.getElementById('btn-to-smart').addEventListener('click', switchToSmart);
  }


  /* ══════════════════════════════════════════════════════════════
     §8-B  THEME
  ══════════════════════════════════════════════════════════════ */
  const KEY_THEME = 'mt_theme';

  function applyTheme (t) {
    if (t === 'light') {
      document.documentElement.dataset.theme = 'light';
    } else if (t === 'auto') {
      document.documentElement.dataset.theme = 'auto';
    } else {
      delete document.documentElement.dataset.theme;  // dark = no attribute
    }
    // Sync the browser chrome colour; for 'auto' read the current system pref
    const systemLight = matchMedia('(prefers-color-scheme: light)').matches;
    const isLight = t === 'light' || (t === 'auto' && systemLight);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = isLight ? '#f1f5f9' : '#0f0f1a';
  }

  // Re-sync theme-color if the OS appearance changes while app is open
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if ((localStorage.getItem(KEY_THEME) || 'dark') === 'auto') applyTheme('auto');
  });

  function themeLabel (t) {
    return t === 'light' ? 'Light' : t === 'auto' ? 'Auto' : 'Dark';
  }

  function cycleTheme () {
    const current = localStorage.getItem(KEY_THEME) || 'dark';
    const next    = current === 'dark' ? 'light' : current === 'light' ? 'auto' : 'dark';
    try { localStorage.setItem(KEY_THEME, next); } catch (e) { /* ignore */ }
    applyTheme(next);
    const val = document.getElementById('settings-theme-value');
    if (val) val.textContent = themeLabel(next);
  }

  /* ══════════════════════════════════════════════════════════════
     §9  DASHBOARD  —  renderDashboard()
     Rebuilds #dashboard-content innerHTML on every renderApp() call.

  ══════════════════════════════════════════════════════════════ */
  function renderDashboard (txns = null) {

    if (!wallet) { document.getElementById('dashboard-content').innerHTML = ''; return; }

    const wallets  = loadWallets();

    const isNeg    = balance < 0;
    const balStr   = (isNeg ? '-$' : '$') + fmt(Math.abs(balance));
    const balClass = isNeg ? 'balance-negative' : 'balance-positive';
    const netPos   = stats.net >= 0;
    const netStr   = (netPos ? '+$' : '-$') + fmt(Math.abs(stats.net));
    const netClass = netPos ? 'text-income' : 'text-expense';
    const countHint = wallets.length > 1
      ? `<span style="font-size:0.72rem;color:var(--muted);font-weight:400;">${wallets.length} wallets</span>`
      : '';
    const periodLabel = _statPeriod === 'week'  ? 'This Week'
                      : _statPeriod === 'month' ? 'This Month'
                      : 'All Time';
    const pBtn = (p, lbl) =>
      `<button class="period-btn${_statPeriod === p ? ' active' : ''}" data-period="${p}"
               role="radio" aria-checked="${_statPeriod === p}">${lbl}</button>`;

    const prevBalance    = _lastBalance;
    const balanceChanged = _lastBalance !== null && _lastBalance !== balance;
    _lastBalance         = balance;

    document.getElementById('dashboard-content').innerHTML = `
      <div class="wallet-selector-row">
        <button class="wallet-selector-btn" id="btn-open-wallets" aria-label="Switch wallet">
          <span class="wallet-selector-name">${escHtml(wallet.name)}</span>
          ${countHint}
          <span class="wallet-selector-caret">▾</span>

      </div>

      <div class="dashboard-balance-row">
        <div>
          <div class="balance-label">Wallet Balance</div>

        </div>

      <div class="period-toggle" role="radiogroup" aria-label="Stats period">

      <div class="stat-grid">

  /* ══════════════════════════════════════════════════════════════
     §9-C  CHART SECTION  —  renderChart()
     Donut chart showing expense breakdown by category for the
     active wallet and selected period. Renders into #chart-section.
     Responds automatically to the period toggle in the dashboard.
  ══════════════════════════════════════════════════════════════ */

  /**
   * Shared period-filter helper.
   * Returns the subset of `txns` belonging to `walletId` and
   * falling within `period` ('week' | 'month' | 'all').
   * Mirrors the filter logic in getPeriodStats.
   */
  function _getPeriodTxns (walletId, period, txns) {
    const base = txns.filter(t => t.walletId === walletId);
    if (period === 'week') {
      const today = new Date();
      const dow   = today.getDay();
      const toMon = dow === 0 ? -6 : 1 - dow;
      const mon   = new Date(today);
      mon.setDate(today.getDate() + toMon);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      // Use local date parts — toISOString() converts to UTC first and produces
      // the wrong calendar date for users in UTC+ or UTC− timezones.
      const localStr = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const monStr = localStr(mon);
      const sunStr = localStr(sun);
      return base.filter(t => t.date >= monStr && t.date <= sunStr);
    }
    if (period === 'month') {
      const now  = new Date();
      const y    = now.getFullYear();
      const m    = String(now.getMonth() + 1).padStart(2, '0');
      const last = new Date(y, now.getMonth() + 1, 0).getDate();
      const s    = `${y}-${m}-01`;
      const e    = `${y}-${m}-${String(last).padStart(2, '0')}`;
      return base.filter(t => t.date >= s && t.date <= e);
    }
    return base; // 'all'
  }

  function renderChart (txns = null) {
    const container = document.getElementById('chart-section');
    if (!container) return;

    const wallet = getActiveWallet();
    if (!wallet) { container.innerHTML = ''; return; }

    const all      = txns !== null ? txns : loadTransactions();
    const filtered = _getPeriodTxns(wallet.id, _statPeriod, all);
    const expenses = filtered.filter(t => t.type === 'expense');

    const periodLabel = _statPeriod === 'week'  ? 'This Week'
                      : _statPeriod === 'month' ? 'This Month' : 'All Time';
    const periodShort = _statPeriod === 'week'  ? 'Week'
                      : _statPeriod === 'month' ? 'Month'      : 'All time';

    if (expenses.length === 0) {
      container.innerHTML = `
        <div class="card">
          <div class="chart-card-header">
            <span class="stat-label">Expense Breakdown</span>
            <span class="stat-label" style="color:var(--accent);">${escHtml(periodLabel)}</span>
          </div>
          <p class="chart-empty">No expenses ${_statPeriod === 'all' ? 'yet' : 'this ' + _statPeriod} to show.</p>
        </div>`;
      return;
    }

    // ── Aggregate by category ────────────────────────────────
    const catMap = Object.create(null);
    for (const tx of expenses) {
      catMap[tx.category] = (catMap[tx.category] || 0) + tx.amount;
    }
    const total  = Object.values(catMap).reduce((s, v) => s + v, 0);
    const slices = Object.entries(catMap)
      .sort((a, b) => b[1] - a[1])
      .map(([name, amount]) => ({
        name, amount,
        pct:   amount / total,
        color: categoryColor(name),
        icon:  categoryIcon(name),
      }));

    // ── SVG donut ────────────────────────────────────────────
    // Stroke-dasharray technique: r=45, stroke-width=22 →
    //   outer edge = 56 px, inner edge = 34 px (donut hole)
    const R  = 45;
    const SW = 22;
    const C  = 2 * Math.PI * R;   // ≈ 282.74
    const cx = 70, cy = 70;

    // Compact total that fits the 120×120 centre
    const totalLabel = total >= 10000
      ? '$' + (total / 1000).toFixed(1) + 'k'
      : '$' + total.toFixed(0);

    let cumPct = 0;
    const circles = slices.map(s => {
      // Subtract 2 px from each slice to create a thin gap between segments
      const dash   = Math.max(0, s.pct * C - 2);
      const gap    = C - dash;
      const offset = -(cumPct * C);
      cumPct += s.pct;
      return `<circle cx="${cx}" cy="${cy}" r="${R}"
        fill="none" stroke="${s.color}" stroke-width="${SW}"
        stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}"
        stroke-dashoffset="${offset.toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"/>`;
    }).join('');

    const svgMark = `
      <svg viewBox="0 0 140 140" width="120" height="120"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Track ring -->
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none"
                stroke="var(--border)" stroke-width="${SW}"/>
        ${circles}
        <!-- Centre labels -->
        <text x="${cx}" y="${cy - 6}" text-anchor="middle"
              font-family="system-ui,sans-serif" font-size="9" font-weight="700"
              fill="var(--muted)" letter-spacing="0.5">${escHtml(periodShort.toUpperCase())}</text>
        <text x="${cx}" y="${cy + 9}" text-anchor="middle"
              font-family="system-ui,sans-serif" font-size="13" font-weight="800"
              fill="var(--text)">${escHtml(totalLabel)}</text>
      </svg>`;

    // ── Legend rows ──────────────────────────────────────────
    const legendRows = slices.map(s => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${s.color}"></span>
        <span class="legend-name">${s.icon} ${escHtml(s.name)}</span>
        <span class="legend-vals">
          <span class="legend-pct">${Math.round(s.pct * 100)}%</span>
          <span class="legend-amt">$${fmt(s.amount)}</span>
        </span>
      </div>`).join('');

    container.innerHTML = `
      <div class="card chart-card">
        <div class="chart-card-header">
          <span class="stat-label">Expense Breakdown</span>
          <span class="stat-label" style="color:var(--accent);">${escHtml(periodLabel)}</span>
        </div>
        <div class="chart-wrap">
          <div class="donut-wrap">${svgMark}</div>
          <div class="chart-legend">${legendRows}</div>
        </div>
      </div>`;
  }


  /* ══════════════════════════════════════════════════════════════
     §10  TRANSACTION HISTORY  —  renderHistory() & event delegation
     Transactions are grouped by date (newest first).
     A single click listener on the stable #history-section handles
     both edit and delete without re-attaching on every render.
  ══════════════════════════════════════════════════════════════ */

  /** Escape user content before innerHTML insertion — prevents XSS */
  function escHtml (str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderHistory (txns = null) {
    const container = document.getElementById('history-section');
    const wallet    = getActiveWallet();
    const all       = txns !== null ? txns : loadTransactions();
    const walletTxns = wallet
      ? all.filter(t => t.walletId === wallet.id)
      : [];

    if (walletTxns.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <p style="font-size:1.5rem; margin-bottom:8px;">📋</p>
          <p style="font-weight:600; color:var(--text);">No transactions yet</p>
          <p style="font-size:0.85rem; margin-top:4px;">Add your first one above ↑</p>
        </div>`;
      return;
    }

    // ── Apply search / type / category filters ───────────────
    let displayTxns = walletTxns;
    if (_filterType !== 'all') {
      displayTxns = displayTxns.filter(t => t.type === _filterType);
    }
    if (_filterCategory) {
      displayTxns = displayTxns.filter(t => t.category === _filterCategory);
    }
    if (_searchQuery) {
      const q = _searchQuery.toLowerCase();
      displayTxns = displayTxns.filter(t =>
        t.description.toLowerCase().includes(q) ||
        (t.category || '').toLowerCase().includes(q)
      );
    }
    const isFiltered = displayTxns.length !== walletTxns.length;

    if (displayTxns.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <p style="font-size:1.5rem; margin-bottom:8px;">🔍</p>
          <p style="font-weight:600; color:var(--text);">No matching transactions</p>
          <p style="font-size:0.85rem; margin-top:4px;">Try adjusting your search or filters.</p>
        </div>`;
      return;
    }

    // Group by date (displayTxns already newest-first from addTransaction)
    // Slice to the current page limit; the Load More button extends it.
    const visibleTxns = displayTxns.slice(0, _historyLimit);

    const groups = Object.create(null);
    for (const tx of visibleTxns) {
      if (!groups[tx.date]) groups[tx.date] = [];
      groups[tx.date].push(tx);
    }
    const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    let html = isFiltered
      ? `<p class="filter-results-note">${displayTxns.length} of ${walletTxns.length} transactions</p>`
      : '';

    for (const date of dates) {
      // Sticky section header: "Today" / "Yesterday" / "May 5"
      html += `<div class="date-header">${escHtml(formatDateLabel(date))}</div>`;

      for (const tx of groups[date]) {
        const isIncome  = tx.type === 'income';
        const rowClass  = isIncome ? 'income-row'  : 'expense-row';
        const amtClass  = isIncome ? 'text-income' : 'text-expense';
        const amtPrefix = isIncome ? '+$' : '-$';
        const icon      = categoryIcon(tx.category);
        const badge     = tx.assumed
          ? `<span class="assumed-badge" aria-label="Warning: type was automatically assumed as expense">⚠ assumed</span>`
          : '';

        // Each row is wrapped in a .tx-swipe-wrap so horizontal swipe reveals
        // ✏ Edit (right) and 🗑 Delete (left) without tapping tiny icon buttons.
        html += `
          <div class="tx-swipe-wrap" data-swipe-id="${escHtml(tx.id)}">
            <div class="tx-swipe-bg tx-swipe-bg-edit"  aria-hidden="true">✏ Edit</div>
            <div class="tx-swipe-bg tx-swipe-bg-delete" aria-hidden="true">🗑 Delete</div>
            <div class="tx-row ${rowClass} tx-swipe-item">
              <div class="tx-body">
                <div class="tx-desc">${escHtml(tx.description)}${badge}</div>
                <div class="tx-meta">
                  <span style="font-size:0.75rem;color:var(--muted);">
                    ${escHtml(formatDateShort(tx.date))}
                  </span>
                  <span class="pill" title="${escHtml(tx.category)}">${icon} ${escHtml(tx.category)}</span>
                </div>
              </div>
              <span class="tx-amount ${amtClass}">${amtPrefix}${fmt(tx.amount)}</span>
              <div class="tx-actions">
                <button class="btn-icon"
                        data-action="edit"
                        data-id="${escHtml(tx.id)}"
                        aria-label="Edit transaction">✏</button>
                <button class="btn-icon danger"
                        data-action="delete"
                        data-id="${escHtml(tx.id)}"
                        aria-label="Delete transaction">🗑</button>
              </div>
            </div>
          </div>`;
      }
    }

    // Load More button — shown when the slice doesn't cover all matched transactions
    const remaining = displayTxns.length - visibleTxns.length;
    if (remaining > 0) {
      const batch = Math.min(50, remaining);
      html += `
        <div class="load-more-wrap">
          <button class="btn-load-more" data-action="load-more">
            Show ${batch} more
            <span class="load-more-remain"> · ${remaining} remaining</span>
          </button>
        </div>`;
    }

    container.innerHTML = html;
  }

  /** Register delegated listener + edit-save button — called once at bootstrap */
  function initHistorySection () {
    // Delegated click: bubbles up from ✏/🗑 to the stable container
    document.getElementById('history-section')
      .addEventListener('click', ev => {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const { action, id } = btn.dataset;
        if (action === 'load-more')      { _historyLimit += 50; renderHistory(); return; }
        if (action === 'edit')           openEditModal(id);
        if (action === 'delete')         handleDeleteTx(id);
        if (action === 'delete-cancel')  cancelDeleteTx(id);
        if (action === 'delete-confirm') doDeleteTx(id);
      });

    // Edit modal save button (static element — wire once)
    document.getElementById('btn-edit-save')
      .addEventListener('click', handleEditSave);
  }

  // Show inline confirm buttons inside the tx row — no native dialog
  function handleDeleteTx (id) {
    // Reset any other row already in confirm state
    document.querySelectorAll('#history-section .tx-row.is-confirming')
      .forEach(r => {
        const cb = r.querySelector('[data-action="delete-confirm"]');
        if (cb) cancelDeleteTx(cb.dataset.id);
      });
    const delBtn = document.querySelector(
      `#history-section [data-action="delete"][data-id="${CSS.escape(id)}"]`
    );
    if (!delBtn) return;
    const row = delBtn.closest('.tx-swipe-item') || delBtn.closest('.tx-row');
    if (!row) return;
    row.classList.add('is-confirming');
    row.querySelector('.tx-actions').innerHTML = `
      <button class="btn-confirm-cancel" data-action="delete-cancel"
              data-id="${escHtml(id)}">Cancel</button>
      <button class="btn-confirm-delete" data-action="delete-confirm"
              data-id="${escHtml(id)}">Delete</button>`;
    row.querySelector('[data-action="delete-confirm"]').focus();
  }

  function cancelDeleteTx (id) {
    const btn = document.querySelector(
      `#history-section [data-action="delete-confirm"][data-id="${CSS.escape(id)}"]`
    );
    if (!btn) return;
    const row = btn.closest('.tx-swipe-item') || btn.closest('.tx-row');
    row.classList.remove('is-confirming');
    row.querySelector('.tx-actions').innerHTML = `
      <button class="btn-icon" data-action="edit" data-id="${escHtml(id)}"
              aria-label="Edit transaction">✏</button>
      <button class="btn-icon danger" data-action="delete" data-id="${escHtml(id)}"
              aria-label="Delete transaction">🗑</button>`;
  }

  function doDeleteTx (id) {
    deleteTransaction(id);
    showToast('Transaction deleted');
    renderApp();
  }


  /* ══════════════════════════════════════════════════════════════
     §11  EDIT MODAL  —  openEditModal() & handleEditSave()
  ══════════════════════════════════════════════════════════════ */

  function openEditModal (id) {
    const tx = loadTransactions().find(t => t.id === id);
    if (!tx) { showToast('Transaction not found.', true); return; }

    _editingId = id;

    // Pre-populate every field with the stored values
    document.getElementById('edit-date').value     = tx.date;
    document.getElementById('edit-type').value     = tx.type;
    document.getElementById('edit-amount').value   = tx.amount.toFixed(2);
    document.getElementById('edit-desc').value     = tx.description;

    const editCat = document.getElementById('edit-category');
    // Remove any stale "(deleted)" placeholder from a previous open
    editCat.querySelectorAll('[data-deleted]').forEach(o => o.remove());
    editCat.value = tx.category;
    if (editCat.value !== tx.category) {
      // The category was deleted — add a visible placeholder so the user
      // sees what was stored and can choose to keep or change it,
      // rather than the select silently defaulting to the first option.
      const opt = document.createElement('option');
      opt.value           = tx.category;
      opt.textContent     = '🗑 ' + tx.category + ' (deleted — pick a new one or keep)';
      opt.dataset.deleted = 'true';
      editCat.prepend(opt);
      editCat.value = tx.category;
    }

    openModal('modal-edit');
    requestAnimationFrame(() => document.getElementById('edit-amount').focus());
  }

  function handleEditSave () {
    const date   = document.getElementById('edit-date').value;
    const type   = document.getElementById('edit-type').value;
    const rawAmt = document.getElementById('edit-amount').value.trim();
    const desc   = document.getElementById('edit-desc').value.trim();
    const cat    = document.getElementById('edit-category').value;
    const amount = parseFloat(rawAmt);

    if (!date)                        return showToast('Please select a date.', true);
    if (!desc)                        return showToast('Please enter a description.', true);
    if (isNaN(amount) || amount <= 0) return showToast('Please enter a valid amount.', true);

    updateTransaction(_editingId, {
      date,
      type,
      amount:      Math.round(amount * 100) / 100,
      description: desc,
      category:    cat,
      assumed:     false   // editing explicitly clears the auto-assumed flag
    });

    closeModal('modal-edit');
    showToast('✓ Transaction updated');
    renderApp();
  }


  /* ══════════════════════════════════════════════════════════════
     §12  CSV EXPORT
     Columns:  Date, Type, Description, Category, Amount
     Rules per spec:
       • Description wrapped in double quotes: "lunch, extra"
       • Internal double quotes doubled:       "said ""hi"""
       • Category also quoted (may contain & or spaces)
       • Amount: positive for income, negative for expense (-8.00)
       • Line endings: CRLF per RFC 4180
       • UTF-8 BOM prepended so Excel auto-detects encoding
       • Filename: money-tracker-YYYY-MM-DD.csv  (today's date)
  ══════════════════════════════════════════════════════════════ */

  /** Build a RFC 4180 CSV string for one wallet's transactions */
  function buildCsv (walletId, allTxns = null) {
    // Sort oldest-first so the spreadsheet reads chronologically.
    const txns = (allTxns !== null ? allTxns : loadTransactions())
      .filter(t => t.walletId === walletId)
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date));
    const rows = ['Date,Type,Description,Category,Amount'];

    // Prefix any value starting with = + - @ with a tab so Excel/LibreOffice
    // don't evaluate it as a formula (CSV injection defence).
    // The tab is invisible in the cell but stops formula evaluation.
    const fSafe = s => /^[=+\-@]/.test(s) ? '\t' + s : s;

    for (const tx of txns) {
      const safeDesc = '"' + fSafe(String(tx.description)).replace(/"/g, '""') + '"';
      const safeCat  = '"' + fSafe(String(tx.category)).replace(/"/g, '""')  + '"';
      // Raw decimal — no thousands separator so spreadsheets read it as a number
      const rawAmt = Number(tx.amount).toFixed(2);
      const amount = tx.type === 'income' ? rawAmt : '-' + rawAmt;
      rows.push([tx.date, tx.type, safeDesc, safeCat, amount].join(','));
    }

    return rows.join('\r\n');
  }

  /** Trigger a single CSV download from a pre-built string */
  function downloadCsv (csv, filename) {
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  /** Export button click → open the wallet picker */
  function handleExportCsv () {
    openExportModal();
  }


  /* ══════════════════════════════════════════════════════════════
     §13  WALLET MANAGEMENT
     migrateToMultiWallet  — one-time migration of legacy data
     openWalletsModal      — renders the switcher/manager modal
     renderWalletList      — builds wallet rows with switch/edit/delete
     handleDeleteWallet    — confirm + delete + re-render
  ══════════════════════════════════════════════════════════════ */

  /**
   * Migrate pre-wallet data to the multi-wallet schema.
   * Runs once: if mt_wallets already exists, returns immediately.
   * If old mt_starting_balance / transactions exist, wraps them in
   * a "My Wallet" with walletId stamped on every transaction.
   */
  function migrateToMultiWallet () {
    if (localStorage.getItem(KEY_WALLETS) !== null) return; // already done

    const existingTxns = loadTransactions();
    // 'mt_starting_balance' is the legacy pre-multi-wallet key — read once for migration only
    const oldBalRaw    = localStorage.getItem('mt_starting_balance');

    if (existingTxns.length > 0 || oldBalRaw !== null) {
      const oldBal = (() => {
        try { const v = JSON.parse(oldBalRaw); return typeof v === 'number' ? v : 0; }
        catch (e) { return 0; }
      })();
      const wallet = { id: makeId(), name: 'My Wallet', startingBalance: oldBal };
      saveTransactions(existingTxns.map(t => ({ ...t, walletId: wallet.id })));
      saveWallets([wallet]);
      setActiveWallet(wallet.id);
      console.log('[MT] Migrated to multi-wallet: "My Wallet"');
    }
    // Fresh install with no old data → wallets stay empty → first-launch modal
  }

  // ── Wallet modal open / close ─────────────────────────────────
  function openWalletsModal () {
    renderWalletList();
    document.getElementById('modal-wallets-title').textContent = 'Wallets';
    openModal('modal-wallets');
  }

  document.getElementById('btn-modal-wallets-close')
    .addEventListener('click', () => closeModal('modal-wallets'));
  document.getElementById('modal-wallets')
    .addEventListener('click', ev => {
      if (ev.target === ev.currentTarget) closeModal('modal-wallets');
    });

  // ── Wallet list renderer ──────────────────────────────────────
  function renderWalletList () {
    const wallets   = loadWallets();
    const container = document.getElementById('wallet-list-items');

    if (!wallets.length) {
      container.innerHTML = `<p style="color:var(--muted);font-size:0.875rem;">No wallets yet.</p>`;
      return;
    }

    const txns = loadTransactions();
    container.innerHTML = wallets.map(w => {
      const bal      = computeWalletBalance(w.id, txns, wallets);
      const isNeg    = bal < 0;
      const balStr   = (isNeg ? '-$' : '$') + fmt(Math.abs(bal));
      const balClass = isNeg ? 'text-expense' : 'text-income';
      const dot      = w.id === _activeWalletId
        ? '<span class="wallet-active-dot"></span>' : '';

      return `
        <div class="wallet-item" data-wswitch="${escHtml(w.id)}">
          <div class="wallet-item-body">
            <div class="wallet-item-name">${dot}${escHtml(w.name)}</div>
            <div class="wallet-item-bal ${balClass}">${balStr}</div>
          </div>
          <button class="btn-icon" data-wedit="${escHtml(w.id)}"
                  aria-label="Edit ${escHtml(w.name)}">✏</button>
          <button class="btn-icon danger" data-wdel="${escHtml(w.id)}"
                  aria-label="Delete ${escHtml(w.name)}">🗑</button>
        </div>`;
    }).join('');

    // Delegated listener — remove the previous one before attaching a new one
    if (container._walletClickHandler) {
      container.removeEventListener('click', container._walletClickHandler);
    }
    container._walletClickHandler = ev => {
      const editBtn = ev.target.closest('[data-wedit]');
      if (editBtn) {
        closeModal('modal-wallets');
        openEditWalletModal(editBtn.dataset.wedit);
        return;
      }
      const delBtn = ev.target.closest('[data-wdel]');
      if (delBtn) { handleDeleteWallet(delBtn.dataset.wdel); return; }

      const wConfirm = ev.target.closest('[data-wdel-confirm]');
      if (wConfirm) { doDeleteWallet(wConfirm.dataset.wdelConfirm); return; }

      const wCancel = ev.target.closest('[data-wdel-cancel]');
      if (wCancel) { cancelDeleteWallet(wCancel.dataset.wdelCancel); return; }

      const row = ev.target.closest('[data-wswitch]');
      if (row) {
        setActiveWallet(row.dataset.wswitch);
        // Reset filter state so the new wallet's history isn't pre-filtered
        // by whatever was active on the previous wallet.
        _searchQuery    = '';
        _filterType     = 'all';
        _filterCategory = '';
        _filterOpen     = false;
        _lastBalance    = null;   // prevent spurious balance pop-animation on switch
        const filterInput = document.getElementById('filter-input');
        if (filterInput) filterInput.value = '';
        const filterCat = document.getElementById('filter-category');
        if (filterCat) filterCat.value = '';   // sync DOM — state already cleared above
        const filterPanel = document.getElementById('filter-panel');
        if (filterPanel) filterPanel.classList.add('hidden');
        const filterToggle = document.getElementById('btn-filter-toggle');
        if (filterToggle) {
          filterToggle.classList.remove('is-open', 'has-filters');
          filterToggle.setAttribute('aria-expanded', 'false');
        }
        document.querySelectorAll('#filter-panel [data-ftype]').forEach(b =>
          b.classList.toggle('active', b.dataset.ftype === 'all'));
        closeModal('modal-wallets');
        renderApp();
      }
    };
    container.addEventListener('click', container._walletClickHandler);
  }

  // ── Delete wallet ─────────────────────────────────────────────
  function handleDeleteWallet (id) {
    const wallet  = loadWallets().find(w => w.id === id);
    if (!wallet) return;
    const txCount = loadTransactions().filter(t => t.walletId === id).length;

    const delBtn = document.querySelector(`[data-wdel="${CSS.escape(id)}"]`);
    if (!delBtn) return;
    const item = delBtn.closest('.wallet-item');
    if (!item) return;

    item.classList.add('is-confirming');
    const txNote = txCount > 0
      ? `<span class="wallet-confirm-note">Removes ${txCount} transaction${txCount === 1 ? '' : 's'}.</span>`
      : '';
    // Swap the ✏ / 🗑 buttons for Cancel / Delete
    item.querySelector('[data-wedit]').remove();
    delBtn.remove();
    item.insertAdjacentHTML('beforeend', `
      ${txNote}
      <button class="btn-confirm-cancel" data-wdel-cancel="${escHtml(id)}">Cancel</button>
      <button class="btn-confirm-delete" data-wdel-confirm="${escHtml(id)}">Delete</button>`);
    item.querySelector('[data-wdel-confirm]').focus();
  }

  function cancelDeleteWallet (_id) { renderWalletList(); }

  function doDeleteWallet (id) {
    const wallet = loadWallets().find(w => w.id === id);
    if (!wallet) return;
    if (deleteWallet(id)) {
      showToast(`"${wallet.name}" deleted`);
      renderWalletList();
      renderApp();
    }
  }

  // ── "Add New Wallet" button in the wallets modal ──────────────
  document.getElementById('btn-new-wallet')
    .addEventListener('click', () => {
      closeModal('modal-wallets');
      openCreateWalletModal();
    });


  /* ══════════════════════════════════════════════════════════════
     §14  EXPORT PICKER MODAL
     openExportModal     — renders checklist, opens modal
     renderExportList    — one checkbox row per wallet
     btn-export-toggle-all — Select all / Deselect all
     btn-export-selected — downloads one file per checked wallet,
                           staggered 400 ms apart so browsers don't
                           block simultaneous download attempts
  ══════════════════════════════════════════════════════════════ */

  function openExportModal () {
    renderExportList();
    openModal('modal-export');
  }

  function renderExportList () {
    const wallets   = loadWallets();
    const container = document.getElementById('export-wallet-list');
    const exportBtn = document.getElementById('btn-export-selected');
    const toggleBtn = document.getElementById('btn-export-toggle-all');

    if (!wallets.length) {
      container.innerHTML =
        '<p style="color:var(--muted);font-size:0.875rem;">No wallets found.</p>';
      exportBtn.disabled = true;
      return;
    }

    const allTxns    = loadTransactions();
    container.innerHTML = wallets.map(w => {
      const txCount  = allTxns.filter(t => t.walletId === w.id).length;
      const isActive = w.id === _activeWalletId;
      const meta     = txCount === 0
        ? 'No transactions'
        : `${txCount} transaction${txCount !== 1 ? 's' : ''}`;

      // Pre-check the currently active wallet
      return `
        <label class="export-wallet-row">
          <input type="checkbox" class="export-cb" value="${escHtml(w.id)}"
                 ${isActive ? 'checked' : ''}>
          <div class="export-check-body">
            <div class="export-check-name">${escHtml(w.name)}</div>
            <div class="export-check-meta">${meta}</div>
          </div>
        </label>`;
    }).join('');

    // Sync button label whenever a checkbox changes
    function syncBtn () {
      const checked = container.querySelectorAll('.export-cb:checked');
      const n       = checked.length;
      exportBtn.disabled   = n === 0;
      exportBtn.textContent = n > 0
        ? `Export ${n} Wallet${n > 1 ? 's' : ''}`
        : 'Export';

      // Toggle-all button label reflects current state
      const all = container.querySelectorAll('.export-cb');
      toggleBtn.textContent = [...all].every(cb => cb.checked)
        ? 'Deselect all' : 'Select all';
    }

    container.querySelectorAll('.export-cb')
      .forEach(cb => cb.addEventListener('change', syncBtn));

    syncBtn();   // run once to reflect the pre-checked active wallet
  }

  // "Select all / Deselect all" toggle
  document.getElementById('btn-export-toggle-all')
    .addEventListener('click', () => {
      const cbs      = document.querySelectorAll('.export-cb');
      const allOn    = [...cbs].every(cb => cb.checked);
      cbs.forEach(cb => { cb.checked = !allOn; });
      cbs[0]?.dispatchEvent(new Event('change'));
    });

  // Download one file per checked wallet, staggered to avoid browser blocks
  document.getElementById('btn-export-selected')
    .addEventListener('click', () => {
      const selected = [...document.querySelectorAll('.export-cb:checked')]
        .map(cb => cb.value);
      if (!selected.length) return;

      const wallets  = loadWallets();
      const allTxns  = loadTransactions();   // one load shared by skip-check and buildCsv
      let queued     = 0;
      let skipped    = 0;

      selected.forEach((walletId, i) => {
        const wallet = wallets.find(w => w.id === walletId);
        if (!wallet) return;

        const txns = allTxns.filter(t => t.walletId === walletId);
        if (txns.length === 0) { skipped++; return; }

        queued++;
        setTimeout(() => {
          const slug     = wallet.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
          const filename = `money-tracker-${slug}-${todayStr()}.csv`;
          downloadCsv(buildCsv(walletId, allTxns), filename);
        }, (queued - 1) * 400);   // 400 ms gap between each download
      });

      closeModal('modal-export');

      if (queued === 0) {
        showToast('Selected wallets have no transactions to export.', true);
      } else {
        const skipNote = skipped > 0 ? ` (${skipped} empty skipped)` : '';
        showToast(`✓ Downloading ${queued} file${queued > 1 ? 's' : ''}…${skipNote}`);
      }
    });

  // Close export modal
  document.getElementById('btn-modal-export-close')
    .addEventListener('click', () => closeModal('modal-export'));
  document.getElementById('modal-export')
    .addEventListener('click', ev => {
      if (ev.target === ev.currentTarget) closeModal('modal-export');
    });
  </script>

  <input type="file" id="restore-file-input" accept=".json,application/json"
         aria-hidden="true" tabindex="-1"
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
